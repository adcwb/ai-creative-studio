services:
  backend:
    build: ./backend
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /app/data
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    volumes:
      - studio-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  studio-data:
