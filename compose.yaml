services:
  backend:
    build: ./backend
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /app/data
      # Fixed SSO return destination; CORS accepts all request origins.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}

      MODEL_CONFIG_KEK_BASE64: ${MODEL_CONFIG_KEK_BASE64:-}
      MODEL_CONFIG_KEK_FILE: ${MODEL_CONFIG_KEK_FILE:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      STUDIO_ADMIN_USER_IDS: ${STUDIO_ADMIN_USER_IDS:-}
      STUDIO_ADMIN_EMAILS: ${STUDIO_ADMIN_EMAILS:-}
      STUDIO_CONFIG_FILE: ${STUDIO_CONFIG_FILE:-}
      MODEL_GATEWAY_ALLOWED_HOSTS: ${MODEL_GATEWAY_ALLOWED_HOSTS:-}
      EXECUTION_POLICY_FILE: ${EXECUTION_POLICY_FILE:-}
      CONTENT_MODERATION_MODE: ${CONTENT_MODERATION_MODE:-disabled}
      GATEWAY_MODERATION_COMMAND: ${GATEWAY_MODERATION_COMMAND:-}
      GATEWAY_MODERATION_SOURCE: ${GATEWAY_MODERATION_SOURCE:-}
      GATEWAY_MODERATION_EXPIRES_AT: ${GATEWAY_MODERATION_EXPIRES_AT:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_TRUSTED_PROXY_CIDRS: ${STUDIO_FRONTEND_IP:-172.30.89.3}/32
      # Install licensed offline runners in a custom backend image first.
      DIGITAL_HUMAN_LICENSE_ACK: ${DIGITAL_HUMAN_LICENSE_ACK:-false}
      DIGITAL_HUMAN_PHOTO_COMMAND: ${DIGITAL_HUMAN_PHOTO_COMMAND:-}
      DIGITAL_HUMAN_PHOTO_MODEL: ${DIGITAL_HUMAN_PHOTO_MODEL:-}
      DIGITAL_HUMAN_PHOTO_PROTOCOL: ${DIGITAL_HUMAN_PHOTO_PROTOCOL:-json-v1}
      DIGITAL_HUMAN_PHOTO_TIMEOUT_SECONDS: ${DIGITAL_HUMAN_PHOTO_TIMEOUT_SECONDS:-120}
      LIP_SYNC_COMMAND: ${LIP_SYNC_COMMAND:-}
      LIP_SYNC_MODEL: ${LIP_SYNC_MODEL:-}
      LIP_SYNC_PROTOCOL: ${LIP_SYNC_PROTOCOL:-json-v1}
      LIP_SYNC_TIMEOUT_SECONDS: ${LIP_SYNC_TIMEOUT_SECONDS:-120}
    volumes:
      - studio-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  frontend:
    networks:
      default:
        ipv4_address: ${STUDIO_FRONTEND_IP:-172.30.89.3}
    build: ./frontend
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  studio-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${STUDIO_INTERNAL_SUBNET:-172.30.89.0/24}
