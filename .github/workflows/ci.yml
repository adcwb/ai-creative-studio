name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
# A newer commit on the same branch supersedes older builds and mutable tags.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    # Pin the OS to match the locked Playwright browser dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24 action runtime
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0; Node 24 action runtime
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24 action runtime
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install local media dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Go checks
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
          go build -o bin/server ./cmd/server
      - name: Process crash and recovery smoke test
        run: python3 scripts/smoke.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node ../scripts/i18n_check.cjs
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chrome
          npm run test:e2e
          npx playwright test -c playwright.auth.config.ts
      - name: Local image provider integration
        run: node scripts/provider_check.mjs
      - name: Script workspace integration and layout
        run: node scripts/project_check.mjs
      - name: Storyboard integration and layout
        run: node scripts/storyboard_check.mjs
      - name: Responsive layout regression
        run: node scripts/layout_check.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24 action runtime
        with:
          python-version: '3.12'
      - name: Validate OpenAPI
        run: |
          pip install openapi-spec-validator==0.7.2
          python -m openapi_spec_validator api/openapi.json
          python scripts/contract_check.py
          python scripts/secure_contract_check.py
          python scripts/iteration10_check.py
      - name: Governance, live-tool safety and offline restore
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/live_eval_test.py
          python scripts/local_models/test_runner.py
          python scripts/recovery_check.py
      - name: Synthetic media workflow and API contracts
        run: python scripts/media_check.py
      - name: Audio, subtitle and video alignment
        run: python scripts/alignment_check.py
  container-smoke:
    name: Two-container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both local images without credentials
        run: docker compose --env-file /dev/null -p studio-docker-check -f compose.yaml build
      - name: Verify proxy, persistence and synthetic media in containers
        run: >-
          python3 scripts/docker_check.py --no-build
          --backend-image studio-docker-check-backend:latest
          --frontend-image studio-docker-check-frontend:latest
  durable-smoke:
    name: PostgreSQL workers and restore
    runs-on: ubuntu-24.04
    env:
      PGPASSFILE: /dev/null
      PGSERVICEFILE: /dev/null
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start disposable local PostgreSQL
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16 ffmpeg fonts-noto-cjk
          mkdir -m 700 /tmp/studio-ci-pg-socket
          /usr/lib/postgresql/16/bin/initdb -D /tmp/studio-ci-pg-data --encoding=UTF8 --auth-local=trust --auth-host=reject
          /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/studio-ci-pg-data -l /tmp/studio-ci-pg.log -o '-k /tmp/studio-ci-pg-socket -p 55439 -h 127.0.0.1' start
          /usr/lib/postgresql/16/bin/createdb -h /tmp/studio-ci-pg-socket -p 55439 studio_ci
          /usr/lib/postgresql/16/bin/createdb -h /tmp/studio-ci-pg-socket -p 55439 studio_backup_source
          /usr/lib/postgresql/16/bin/createdb -h /tmp/studio-ci-pg-socket -p 55439 studio_backup_target
      - name: Real database transactions, leases, isolation and native restore
        working-directory: backend
        run: |
          export STUDIO_POSTGRES_TEST_DSN="host=/tmp/studio-ci-pg-socket port=55439 user=$(id -un) dbname=studio_ci sslmode=disable passfile=/dev/null"
          export JOBQUEUE_TEST_DSN="$STUDIO_POSTGRES_TEST_DSN"
          export STUDIO_BLOB_TEST_DSN="$STUDIO_POSTGRES_TEST_DSN"
          export STUDIO_WORKER_TEST_DSN="$STUDIO_POSTGRES_TEST_DSN"
          export STUDIO_AUDIT_TEST_DSN="$STUDIO_POSTGRES_TEST_DSN"
          export STUDIO_POSTGRES_BIN_DIR=/usr/lib/postgresql/16/bin
          export STUDIO_BACKUP_TEST_DSN="postgresql://$(id -un)@/studio_backup_source?host=/tmp/studio-ci-pg-socket&port=55439&sslmode=disable"
          export STUDIO_BACKUP_TARGET_DSN="postgresql://$(id -un)@/studio_backup_target?host=/tmp/studio-ci-pg-socket&port=55439&sslmode=disable"
          export STUDIO_TEST_PG_DUMP=/usr/lib/postgresql/16/bin/pg_dump
          export STUDIO_TEST_PG_RESTORE=/usr/lib/postgresql/16/bin/pg_restore
          go test -race ./...
          go build ./cmd/...
          python3 ../scripts/test_scheduled_backup.py
      - name: Two APIs, two workers and actual media
        run: >-
          python3 scripts/multiservice_check.py --pg-bin /usr/lib/postgresql/16/bin
          --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)"
      - name: PostgreSQL desktop and mobile workflow
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chrome
          cd ..
          python3 scripts/postgres_browser_check.py --pg-bin /usr/lib/postgresql/16/bin --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)" --chromium "$(command -v google-chrome)"
          python3 scripts/postgres_browser_check.py --pg-bin /usr/lib/postgresql/16/bin --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)" --chromium "$(command -v google-chrome)" --quote-fixture
      - name: Managed evaluation acceptance without a worker or supplier calls
        run: >-
          python3 scripts/managed_eval_check.py --pg-bin /usr/lib/postgresql/16/bin
          --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)"
      - name: Stop disposable PostgreSQL
        if: always()
        run: /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/studio-ci-pg-data -m fast stop || true
  docker:
    name: Docker / ${{ matrix.component }}
    needs: [verify, container-smoke, durable-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      # Keep the secret-backed namespace within this job; never forward it as a job output.
      PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.repository == 'adcwb/ai-creative-studio' }}
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'local' }}
      IMAGE_REPOSITORY: ${{ matrix.component == 'backend' && (vars.DOCKERHUB_BACKEND_REPOSITORY || 'ai-creative-studio-backend') || (vars.DOCKERHUB_FRONTEND_REPOSITORY || 'ai-creative-studio-frontend') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Docker Hub image target
        shell: bash
        run: |
          # Repository variables are data, never interpolated into shell source.
          if [[ "$PUBLISH_IMAGE" == 'true' && "$IMAGE_NAMESPACE" == 'local' ]]; then
            echo 'Configure DOCKERHUB_NAMESPACE or DOCKERHUB_USERNAME before publishing'
            exit 1
          fi
          [[ "$IMAGE_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid Docker Hub namespace'; exit 1; }
          [[ "$IMAGE_REPOSITORY" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo 'Use a repository name without registry or namespace'; exit 1; }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (publish only on configured upstream pushes)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record published image digest
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          {
            printf '### Published %s image\n\n' "$IMAGE_COMPONENT"
            printf -- '- Commit tag: `sha-%s`\n' "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Repository name: `%s` (under configured Docker Hub namespace)\n' "$IMAGE_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
