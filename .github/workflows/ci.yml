name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same branch supersedes older builds and mutable tags.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Static and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go format, vet and command builds
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go build ./cmd/...
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node ../scripts/i18n_check.cjs
      - name: Validate CI partition contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py' -v
  go-race:
    name: Go race / ${{ matrix.storage }} / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        storage: [file, postgres]
        group: [a-m, other, native]
    env:
      PGPASSFILE: /dev/null
      PGSERVICEFILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare local media dependencies
        timeout-minutes: 8
        uses: ./.github/actions/ci-dependencies
        with:
          postgres: ${{ matrix.storage == 'postgres' && 'true' || 'false' }}
      - name: Start disposable local PostgreSQL
        if: matrix.storage == 'postgres'
        run: bash scripts/ci_postgres.sh start
      - name: Race tests (complementary groups, fresh results)
        env:
          STUDIO_CI_TEST_GROUP: ${{ matrix.group }}
        run: bash scripts/ci_go_tests.sh
      - name: Stop disposable PostgreSQL
        if: always() && matrix.storage == 'postgres'
        run: bash scripts/ci_postgres.sh stop
  integrations:
    name: API, media, recovery and layout contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare local media dependencies
        timeout-minutes: 8
        uses: ./.github/actions/ci-dependencies
      - name: Build isolated services
        working-directory: backend
        run: go build -o bin/ ./cmd/server ./cmd/bootstrap-user
      - name: Process crash and recovery smoke test
        run: python3 scripts/smoke.py
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Check runner browser for integration scripts
        working-directory: frontend
        run: node ../scripts/ci_browser_check.mjs
      - name: Local image provider integration
        run: node scripts/provider_check.mjs
      - name: Script workspace integration and layout
        run: node scripts/project_check.mjs
      - name: Storyboard integration and layout
        run: node scripts/storyboard_check.mjs
      - name: Responsive layout regression
        timeout-minutes: 5
        run: |
          node --test scripts/layout_images_test.mjs
          node scripts/layout_check.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24 action runtime
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci-requirements.txt
      - name: Validate OpenAPI
        run: |
          pip install -r scripts/ci-requirements.txt
          python -m openapi_spec_validator api/openapi.json
          python scripts/contract_check.py
          python scripts/secure_contract_check.py
          python scripts/story_contract_check.py
          python scripts/iteration10_check.py
          python scripts/iteration10_followup_check.py
      - name: Governance, live-tool safety and offline restore
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/live_eval_test.py
          python scripts/local_models/test_runner.py
          python scripts/recovery_check.py
      - name: Synthetic media workflow and API contracts
        run: python scripts/media_check.py
      - name: Audio, subtitle and video alignment
        run: python scripts/alignment_check.py
  browser-tests:
    name: Browser acceptance / ${{ matrix.suite }} / ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, routing, auth]
        device: [desktop, mobile]
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare local media dependencies
        timeout-minutes: 8
        uses: ./.github/actions/ci-dependencies
      - name: Build isolated browser services
        working-directory: backend
        run: go build -o bin/ ./cmd/server ./cmd/bootstrap-user
      - name: Browser tests with an isolated backend per runner
        working-directory: frontend
        env:
          STUDIO_CI_BROWSER_SUITE: ${{ matrix.suite }}
          STUDIO_CI_BROWSER_DEVICE: ${{ matrix.device }}
        run: |
          npm ci
          node ../scripts/ci_browser_check.mjs
          bash ../scripts/ci_browser_tests.sh
  gateway-tests:
    name: Gateway creation workflows / ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      STUDIO_GATEWAY_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare local media dependencies
        timeout-minutes: 8
        uses: ./.github/actions/ci-dependencies
      - name: Build the local fixture server
        working-directory: backend
        run: go build -o bin/server ./cmd/server
      - name: Real gateway contracts on desktop and mobile
        working-directory: frontend
        run: |
          npm ci
          node ../scripts/ci_browser_check.mjs
          npm run test:gateway
  container-smoke:
    name: Two-container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local backend image without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: BUILD_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: studio-docker-check-backend:latest
          cache-from: type=gha,scope=studio-backend,timeout=2m
          cache-to: type=gha,scope=studio-backend,mode=max,ignore-error=true,timeout=2m
      - name: Build local frontend image without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: BUILD_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: studio-docker-check-frontend:latest
          cache-from: type=gha,scope=studio-frontend,timeout=2m
          cache-to: type=gha,scope=studio-frontend,mode=max,ignore-error=true,timeout=2m
      - name: Verify proxy, persistence and synthetic media in containers
        run: >-
          python3 scripts/docker_check.py --no-build
          --backend-image studio-docker-check-backend:latest
          --frontend-image studio-docker-check-frontend:latest
  durable-smoke:
    name: PostgreSQL workers and restore
    runs-on: ubuntu-24.04
    env:
      PGPASSFILE: /dev/null
      PGSERVICEFILE: /dev/null
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare local media and PostgreSQL dependencies
        timeout-minutes: 8
        uses: ./.github/actions/ci-dependencies
        with:
          postgres: 'true'
      - name: Start disposable local PostgreSQL
        run: bash scripts/ci_postgres.sh start
      - name: Scheduled backup acceptance
        run: python3 scripts/test_scheduled_backup.py
      - name: Two APIs, two workers and actual media
        run: >-
          python3 scripts/multiservice_check.py --pg-bin /usr/lib/postgresql/16/bin
          --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)"
      - name: PostgreSQL desktop and mobile workflow
        run: |
          cd frontend
          npm ci
          node ../scripts/ci_browser_check.mjs
          cd ..
          python3 scripts/postgres_browser_check.py --pg-bin /usr/lib/postgresql/16/bin --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)" --chromium "$(command -v google-chrome)"
          python3 scripts/postgres_browser_check.py --pg-bin /usr/lib/postgresql/16/bin --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)" --chromium "$(command -v google-chrome)" --quote-fixture
      - name: Managed evaluation acceptance without a worker or supplier calls
        run: >-
          python3 scripts/managed_eval_check.py --pg-bin /usr/lib/postgresql/16/bin
          --pg-socket /tmp/studio-ci-pg-socket --pg-port 55439 --pg-user "$(id -un)"
      - name: Stop disposable PostgreSQL
        if: always()
        run: bash scripts/ci_postgres.sh stop
  browser-smoke:
    name: Browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [browser-tests]
    steps:
      - name: Require all validation jobs
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['VALIDATION_RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not results or any(r['result'] != 'success' for r in results.values()):
              raise SystemExit('Required validation failed, was cancelled or was skipped')
          PYCODE
  gateway-smoke:
    name: Gateway creation workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [gateway-tests]
    steps:
      - name: Require all validation jobs
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['VALIDATION_RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not results or any(r['result'] != 'success' for r in results.values()):
              raise SystemExit('Required validation failed, was cancelled or was skipped')
          PYCODE
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [quality, go-race, integrations, browser-smoke, gateway-smoke, container-smoke, durable-smoke]
    steps:
      - name: Require all validation jobs
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['VALIDATION_RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not results or any(r['result'] != 'success' for r in results.values()):
              raise SystemExit('Required validation failed, was cancelled or was skipped')
          PYCODE
  docker:
    name: Docker / ${{ matrix.component }}
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      # Keep the secret-backed namespace within this job; never forward it as a job output.
      PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.repository == 'adcwb/ai-creative-studio' }}
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'local' }}
      IMAGE_REPOSITORY: ${{ matrix.component == 'backend' && (vars.DOCKERHUB_BACKEND_REPOSITORY || 'ai-creative-studio-backend') || (vars.DOCKERHUB_FRONTEND_REPOSITORY || 'ai-creative-studio-frontend') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Docker Hub image target
        shell: bash
        run: |
          # Repository variables are data, never interpolated into shell source.
          if [[ "$PUBLISH_IMAGE" == 'true' && "$IMAGE_NAMESPACE" == 'local' ]]; then
            echo 'Configure DOCKERHUB_NAMESPACE or DOCKERHUB_USERNAME before publishing'
            exit 1
          fi
          [[ "$IMAGE_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid Docker Hub namespace'; exit 1; }
          [[ "$IMAGE_REPOSITORY" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo 'Use a repository name without registry or namespace'; exit 1; }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (publish only on configured upstream pushes)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          build-args: BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=studio-${{ matrix.component }},timeout=2m
          cache-to: type=gha,scope=studio-${{ matrix.component }},mode=max,ignore-error=true,timeout=2m
      - name: Record published image digest
        if: env.PUBLISH_IMAGE == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          {
            printf '### Published %s image\n\n' "$IMAGE_COMPONENT"
            printf -- '- Commit tag: `sha-%s`\n' "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Repository name: `%s` (under configured Docker Hub namespace)\n' "$IMAGE_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
